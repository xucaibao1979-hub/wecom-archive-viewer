<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }} · 会话存档</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#263346;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #dfe5ee;padding:18px max(20px,calc((100vw - 1040px)/2));box-shadow:0 2px 10px #20314c0c}h1{font-size:20px;margin:0 0 5px}.sub{font-size:12px;color:#738298}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}input,select{border:1px solid #cfd8e6;border-radius:7px;background:#fff;color:inherit;padding:10px 12px;font:inherit}input{flex:1;min-width:220px}select{min-width:180px}main{max-width:1040px;margin:0 auto;padding:24px 20px}.message{display:flex;gap:11px;margin:0 0 22px;align-items:flex-start}.avatar{flex:none;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700}.body{min-width:0;max-width:min(780px,calc(100% - 50px))}.meta{font-size:12px;color:#8190a5;margin:1px 0 7px}.bubble{display:inline-block;max-width:100%;background:#fff;border:1px solid #e1e7ef;border-radius:10px;padding:11px 14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 7px #1e2f4a08}.quote{border-left:3px solid #5c89ef;background:#f1f5fc;color:#596d89;padding:8px 10px;margin-bottom:9px;border-radius:4px}.quote strong{display:block;color:#435a7a;font-size:12px}.attachment{display:block;margin-top:9px}.attachment img{display:block;max-width:min(360px,100%);max-height:420px;border-radius:6px;cursor:zoom-in}.attachment small{color:#8390a0}.badge{display:inline-block;margin-left:7px;padding:1px 6px;border-radius:4px;background:#fff0e4;color:#ac6033;font-size:11px}.empty{text-align:center;color:#8490a0;margin-top:100px}@media(max-width:650px){header{padding:15px}main{padding:18px 12px}.body{max-width:calc(100% - 48px)}}
</style></head><body>
<header><h1 id="title"></h1><div id="count" class="sub"></div><div class="filters"><input id="keyword" type="search" placeholder="搜索文字、手机号或业务关键词" autocomplete="off"><select id="sender"><option value="">全部成员</option></select></div></header>
<main id="messages"></main>
<script id="archive-data" type="application/json">{{ {"version": 1, "title": title, "messages": messages}|tojson }}</script>
<script>
(()=>{'use strict';const data=JSON.parse(document.getElementById('archive-data').textContent),host=document.getElementById('messages'),keyword=document.getElementById('keyword'),sender=document.getElementById('sender'),count=document.getElementById('count');document.getElementById('title').textContent=data.title;const people=new Map();for(const m of data.messages)people.set(m.sender.id||m.sender.name,m.sender.name);for(const [id,name] of [...people].sort((a,b)=>a[1].localeCompare(b[1],'zh-CN'))){const option=document.createElement('option');option.value=id;option.textContent=name;sender.append(option);}const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};function draw(){const q=keyword.value.trim().toLocaleLowerCase(),who=sender.value;host.replaceChildren();let shown=0;for(const m of data.messages){if(who&&(m.sender.id||m.sender.name)!==who)continue;if(q&&!`${m.content||''} ${m.quote?.content||''} ${m.sender.name} ${m.attachments.map(a=>a.name).join(' ')}`.toLocaleLowerCase().includes(q))continue;shown++;const row=el('article','message'),avatar=el('span','avatar',(m.sender.name||'?').slice(0,1)),body=el('div','body'),meta=el('div','meta',`${m.sender.name} · ${m.timestamp.replace('T',' ')}`),bubble=el('div','bubble');let hash=0;for(const char of m.sender.id||m.sender.name)hash=(hash*31+char.charCodeAt(0))>>>0;avatar.style.background=`hsl(${hash%360} 58% 55%)`;if(m.recalled)meta.append(el('span','badge','已撤回'));if(m.quote){const quote=el('div','quote');if(m.quote.sender)quote.append(el('strong','',m.quote.sender));quote.append(document.createTextNode(m.quote.content));bubble.append(quote);}if(m.content)bubble.append(document.createTextNode(m.content));for(const a of m.attachments){const wrap=el('div','attachment');if((a.data||a.url)&&['image','emotion'].includes(a.type)){const img=el('img');img.src=a.data||a.url;img.alt=a.name;img.loading='lazy';img.onerror=()=>img.replaceWith(el('small','',a.name+'（图片无法加载）'));img.onclick=()=>window.open(a.data||a.url,'_blank');wrap.append(img);}else wrap.append(el('small','',`📎 ${a.name}${a.data?'':'（文件未嵌入）'}`));bubble.append(wrap);}if(!m.content&&!m.quote&&!m.attachments.length)bubble.append(document.createTextNode(`[${m.type||'消息'}]`));body.append(meta,bubble);row.append(avatar,body);host.append(row);}count.textContent=`显示 ${shown} / ${data.messages.length} 条 · 本地离线查询`;if(!shown)host.append(el('p','empty','没有匹配的聊天记录'));}keyword.addEventListener('input',draw);sender.addEventListener('change',draw);draw();})();
</script></body></html>
