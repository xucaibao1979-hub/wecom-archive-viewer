<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话存档 · 本地查看器</title><link rel="stylesheet" href="/static/style.css?v=52"></head><body>
<header><div class="brand-area"><button class="brand home-link" id="homeLink" type="button" title="返回主页"><span class="logo">档</span><strong>会话存档</strong></button><button id="sidebarToggle" class="header-icon-button" type="button" aria-label="收起左侧菜单" aria-expanded="true" title="展开或收起左侧菜单">☰</button></div><div class="header-actions"><button id="themeToggle" class="header-icon-button" type="button" aria-label="切换深色主题" title="切换主题">☾</button><div class="account-menu" tabindex="0"><button id="accountTrigger" type="button" aria-haspopup="true"><span id="accountName"></span><span aria-hidden="true">⌄</span></button><div class="account-dropdown"><button id="settingsBtn" type="button">设置</button><button id="logoutBtn" type="button">退出</button></div></div></div></header>
<main><nav aria-label="主导航"><details class="nav-group"><summary title="会话内容"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5Z"/><path d="M8 9h8M8 12h5"/></svg></span>会话内容</summary><button class="nav-item" data-view="employees">存档员工</button><button class="nav-item" data-view="group">群聊会话</button><button class="nav-item" data-view="export">会话导出</button><button class="nav-item" data-view="files">群文件内容</button></details><details class="nav-group"><summary title="客户管理"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 19v-2a6 6 0 0 1 12 0v2H3ZM16 6a3 3 0 0 1 0 6M17 14a5 5 0 0 1 4 5"/></svg></span>客户管理</summary><button class="nav-item" data-view="customers">客户列表</button><button class="nav-item" data-view="groups">客户群列表</button></details><details class="nav-group"><summary title="数据统计"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4M4 20h16M8 16v-4M13 16V7M18 16v-7"/></svg></span>数据统计</summary><button class="nav-item" data-view="customerStats">客户数据</button><button class="nav-item" data-view="conversationStats">会话数据</button></details><details class="nav-group"><summary title="客服工具"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 16 0v5a2 2 0 0 1-2 2h-2v-7h4M4 12v7h4v-7H4M10 20h4"/></svg></span>客服工具</summary><button class="nav-item" data-view="officialActivity">官群活跃度</button><button class="nav-item" data-view="serviceMessages">客服消息统计</button></details></nav>
<section class="employee-pane" id="employeePane"><div class="employee-search"><input id="employeeSearch" type="search" placeholder="搜索存档员工"><input id="employeeDate" type="date" aria-label="员工消息日期" title="选择统计日期"></div><div id="employeeList" class="employee-list"></div><div class="list-pager" id="employeePager"><select id="employeePageSize" aria-label="每页存档员工数"><option value="20">20条/页</option><option value="50">50条/页</option><option value="100">100条/页</option></select><button id="employeePrev" aria-label="上一页">‹</button><span id="employeePageInfo">1/1</span><button id="employeeNext" aria-label="下一页">›</button></div></section>
<section class="conversation-pane" id="conversationPane"><div class="pane-heading"><h2 id="listTitle">会话存档</h2><span id="conversationCount"></span></div><div class="list-search"><input id="listSearch" placeholder="搜索群名或会话"><input id="groupDate" type="date" aria-label="群聊消息日期" title="选择群聊日期" hidden></div><div id="conversationList" class="conversation-list"></div><div class="list-pager" id="conversationPager"><select id="conversationPageSize" aria-label="每页会话数"><option value="20">20条/页</option><option value="50">50条/页</option><option value="100">100条/页</option></select><button id="conversationPrev" aria-label="上一页">‹</button><span id="conversationPageInfo">1/1</span><button id="conversationNext" aria-label="下一页">›</button></div></section>
<section class="chat-pane"><div class="chat-heading"><div><h2 id="chatTitle">会话存档</h2><p id="chatSub">点击左侧菜单选择功能</p></div><div class="chat-actions"><input id="messageSearch" placeholder="搜索当前会话内容" disabled><input id="directorySearch" type="search" aria-label="搜索客户或客户群" placeholder="搜索" hidden><input id="fileSearch" type="search" aria-label="搜索当前群文件" placeholder="搜索文件或发送人" hidden><input id="fileStartDate" type="date" aria-label="文件开始日期" title="文件开始日期" hidden><input id="fileEndDate" type="date" aria-label="文件结束日期" title="文件结束日期" hidden><button id="fileAllBtn" type="button" aria-pressed="false" hidden>全部</button><button id="downloadFilesBtn" type="button" hidden disabled>批量下载</button><button id="rawToggle" class="raw-toggle" type="button" aria-pressed="false" hidden>显示原始记录</button><button id="exportBtn" type="button">导出</button></div></div><div class="chat-toolbar" id="chatToolbar"><div class="type-tabs"><button class="type-tab active" data-type="all">全部</button><button class="type-tab" data-type="file">文件</button><button class="type-tab" data-type="media">图片/视频</button><button class="type-tab" data-type="link">链接</button><button class="type-tab" data-type="weapp">小程序</button></div><div class="date-filter"><label>发送人 <input id="senderFilter" placeholder="姓名或员工ID"></label><label>开始日期 <input id="startDate" type="date"></label><label>结束日期 <input id="endDate" type="date"></label><button id="clearDates" type="button">清除日期</button></div></div><div class="chat-content" id="chatContent"><div class="empty">点击左侧“会话内容”展开菜单</div></div><div class="chat-footer" id="chatPager"><span id="chatCount">会话存档 · 只读</span><select id="chatPageSize" aria-label="每页消息数"><option value="10">10条/页</option><option value="20">20条/页</option><option value="50">50条/页</option><option value="100">100条/页</option><option value="500">500条/页</option><option value="all">全部</option><option value="custom">自定义</option></select><input id="chatCustomSize" type="number" min="1" max="500" value="200" aria-label="自定义每页条数" title="1至500条" hidden><button id="chatPrev" type="button">上一页</button><span id="chatPageInfo">1/1</span><button id="chatNext" type="button">下一页</button><input id="chatPageJump" type="number" min="1" value="1" aria-label="跳转页码" title="输入页码"><button id="chatPageGo" type="button">跳转</button></div></section></main>
<div id="loginOverlay" class="overlay"><form id="loginForm" class="login-card"><h2>登录会话存档</h2><p id="loginError"></p><input name="username" autocomplete="username" placeholder="用户名" required><input name="password" type="password" autocomplete="current-password" placeholder="密码" required><button>登录</button></form></div>
<script src="/static/app.js?v=61"></script></body></html>
