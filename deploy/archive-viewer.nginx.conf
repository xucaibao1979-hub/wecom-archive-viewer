# 放入 /etc/nginx/conf.d/archive-viewer.conf；证书申请前先使用 HTTP。
log_format archive_no_query '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status '
                            '$body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name archive.example.com;
    access_log /var/log/nginx/archive-viewer-access.log archive_no_query;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
